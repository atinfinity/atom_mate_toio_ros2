[platformio]
; pio run のデフォルトはファームウェアのみ(native はテスト専用)
default_envs = m5stack-atom

; ファームウェア共通設定
[esp32_base]
platform = espressif32@^6.8.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200

; micro-ROS 設定
board_microros_distro = jazzy
board_microros_transport = wifi

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit_VL53L0X@^1.2.4
    fastled/FastLED@^3.7.0

; Range モード(デフォルト。ブラウザから配布するのはこちら)
[env:m5stack-atom]
extends = esp32_base
build_flags = -DPUBLISH_MODE=0

; LaserScan モード: pio run -e m5stack-atom-scan
[env:m5stack-atom-scan]
extends = esp32_base
build_flags = -DPUBLISH_MODE=1

; ホスト上で実行する単体テスト用: pio test -e native
[env:native]
platform = native
test_framework = unity
