name: PlatformIO CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      # micro_ros_platformio が ~/.platformio/penv を必要とするため、
      # pip ではなく公式インストーラで導入する(penv が作成される)
      - name: Install PlatformIO
        run: |
          curl -fsSL -o get-platformio.py https://raw.githubusercontent.com/platformio/platformio-core-installer/master/get-platformio.py
          python3 get-platformio.py
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"

      # config.h は gitignore 対象のためテンプレートから生成(ビルド確認用のダミー値)
      - name: Create config.h from template
        run: cp include/config.h.example include/config.h

      - name: Run unit tests (native)
        run: pio test -e native

      - name: Build firmware (range mode)
        run: pio run

      - name: Build firmware (scan mode)
        run: |
          sed -i 's/#define PUBLISH_MODE PUBLISH_MODE_RANGE/#define PUBLISH_MODE PUBLISH_MODE_SCAN/' include/config.h
          pio run
