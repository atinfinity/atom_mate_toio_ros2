name: PlatformIO CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:  # 手動実行: main の最新を Pages にデプロイ(実機確認用。Release は作らない)

env:
  FW_NAME: atom_mate_toio_ros2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      # micro_ros_platformio が ~/.platformio/penv を必要とするため、
      # pip ではなく公式インストーラで導入する(penv が作成される)
      - name: Install PlatformIO
        run: |
          curl -fsSL -o get-platformio.py https://raw.githubusercontent.com/platformio/platformio-core-installer/master/get-platformio.py
          python3 get-platformio.py
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"
          "$HOME/.platformio/penv/bin/pip" install "esptool==4.8.1"

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests (native)
        run: pio test -e native

      - name: Build firmware (range mode)
        env:
          PLATFORMIO_BUILD_FLAGS: -DFW_VERSION=\"${{ steps.ver.outputs.version }}\"
        run: pio run -e m5stack-atom

      - name: Build firmware (scan mode)
        env:
          PLATFORMIO_BUILD_FLAGS: -DFW_VERSION=\"${{ steps.ver.outputs.version }}\"
        run: pio run -e m5stack-atom-scan

      # ESP Web Tools 用に bootloader / partitions / boot_app0 / app を 1 ファイルに結合(offset 0x0)
      # range / scan の両モードを生成する
      - name: Merge firmware images
        run: |
          mkdir -p build
          merge() {  # merge <env> <suffix>
            B=".pio/build/$1"
            python -m esptool --chip esp32 merge_bin \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              -o "build/${FW_NAME}$2.merged.bin" \
              0x1000  "$B/bootloader.bin" \
              0x8000  "$B/partitions.bin" \
              0xe000  "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
              0x10000 "$B/firmware.bin"
            cp "$B/firmware.bin" "build/${FW_NAME}$2.app.bin"
          }
          merge m5stack-atom ""
          merge m5stack-atom-scan "-scan"
          ls -l build

      - name: Assemble site (docs + firmware + manifest)
        run: |
          mkdir -p site/firmware
          cp -r docs/. site/
          rm -f site/*.md  # Markdown ドキュメントは Pages に含めない
          cp "build/${FW_NAME}.merged.bin" "build/${FW_NAME}-scan.merged.bin" site/firmware/
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i "s/__VERSION__/${VERSION}/g" site/manifest.json site/manifest-scan.json site/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.version }}
          path: build/

      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          path: site

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          cp "build/${FW_NAME}.merged.bin"      "${FW_NAME}-${VERSION}.merged.bin"
          cp "build/${FW_NAME}.app.bin"         "${FW_NAME}-${VERSION}.app.bin"
          cp "build/${FW_NAME}-scan.merged.bin" "${FW_NAME}-${VERSION}-scan.merged.bin"
          cp "build/${FW_NAME}-scan.app.bin"    "${FW_NAME}-${VERSION}-scan.app.bin"
          gh release create "$VERSION" \
            --title "${FW_NAME} ${VERSION}" \
            --generate-notes \
            "${FW_NAME}-${VERSION}.merged.bin#フルフラッシュイメージ (offset 0x0, Range モード)" \
            "${FW_NAME}-${VERSION}.app.bin#アプリのみ (offset 0x10000, Range モード)" \
            "${FW_NAME}-${VERSION}-scan.merged.bin#フルフラッシュイメージ (offset 0x0, LaserScan モード)" \
            "${FW_NAME}-${VERSION}-scan.app.bin#アプリのみ (offset 0x10000, LaserScan モード)"

  deploy-pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
