<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <!-- 公開されている製品写真・寸法(toio コアキューブ 32x32x19mm / ATOM Mate for toio 32x32mm / ATOM Matrix 24x24x14mm)をもとに作成したイメージ図 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9756a"/>
    </marker>
    <g id="ledrow">
      <rect x="2.8"  y="2.8" width="3.04" height="3.04" rx="0.7"/>
      <rect x="6.64" y="2.8" width="3.04" height="3.04" rx="0.7"/>
      <rect x="10.48" y="2.8" width="3.04" height="3.04" rx="0.7"/>
      <rect x="14.32" y="2.8" width="3.04" height="3.04" rx="0.7"/>
      <rect x="18.16" y="2.8" width="3.04" height="3.04" rx="0.7"/>
    </g>
  </defs>

  <rect x="0" y="0" width="660" height="430" fill="#ffffff"/>

  <!-- ================= toio コアキューブ (32x32x19) ================= -->
  <!-- 前面 -->
  <g transform="matrix(3.4641 -2 0 4 170 302)">
    <rect x="0" y="0" width="32" height="19" fill="#f7f7f9" stroke="#c9c9cf" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="15.5" x2="32" y2="15.5" stroke="#e4e4e8" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <text x="16" y="12" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dcdce0" letter-spacing="0.4">toio</text>
  </g>
  <!-- 左側面 -->
  <g transform="matrix(3.4641 2 0 4 59.15 238)">
    <rect x="0" y="0" width="32" height="19" fill="#e6e6ea" stroke="#c9c9cf" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <circle cx="16" cy="12" r="6" fill="#2c2c30"/>
    <circle cx="16" cy="12" r="2.2" fill="#5b5b62"/>
  </g>

  <!-- ================= ATOM Mate for toio (32x32, 高さ27) ================= -->
  <!-- 天面 -->
  <g transform="matrix(3.4641 2 -3.4641 2 170 66)">
    <rect x="0" y="0" width="32" height="32" fill="#b3b3ba" stroke="#6e6e76" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <rect x="2.5" y="2.5" width="27" height="27" fill="#a5a5ac" stroke="#8b8b92" stroke-width="0.8" vector-effect="non-scaling-stroke"/>
  </g>
  <!-- 前面(埴輪顔: 目=取り付け穴, 口=ToFセンサ窓) -->
  <g transform="matrix(3.4641 -2 0 4 170 194)">
    <rect x="0" y="0" width="32" height="27" fill="#97979d" stroke="#6e6e76" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <rect x="14.3" y="0" width="3.4" height="14.5" fill="#8b8b91"/>
    <circle cx="9"  cy="8" r="4.4" fill="#4b4b52"/>
    <circle cx="9"  cy="8.5" r="3" fill="#3a3a41"/>
    <circle cx="23" cy="8" r="4.4" fill="#4b4b52"/>
    <circle cx="23" cy="8.5" r="3" fill="#3a3a41"/>
    <rect x="13.6" y="14.5" width="4.8" height="5" rx="0.8" fill="#191a1e"/>
    <circle cx="15.3" cy="17" r="0.8" fill="#2e3550"/>
    <circle cx="17.1" cy="17" r="0.8" fill="#232a3d"/>
    <rect x="4.5"  y="23.6" width="5" height="1.3" rx="0.65" fill="#74747c"/>
    <rect x="22.5" y="23.6" width="5" height="1.3" rx="0.65" fill="#74747c"/>
  </g>
  <!-- 左側面 -->
  <g transform="matrix(3.4641 2 0 4 59.15 130)">
    <rect x="0" y="0" width="32" height="27" fill="#84848b" stroke="#6e6e76" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <g fill="#6a6a72">
      <circle cx="2.5" cy="3"   r="0.55"/><circle cx="4.7" cy="3"   r="0.55"/><circle cx="6.9" cy="3"   r="0.55"/><circle cx="9.1" cy="3"   r="0.55"/>
      <circle cx="2.5" cy="5.2" r="0.55"/><circle cx="4.7" cy="5.2" r="0.55"/><circle cx="6.9" cy="5.2" r="0.55"/><circle cx="9.1" cy="5.2" r="0.55"/>
      <circle cx="2.5" cy="7.4" r="0.55"/><circle cx="4.7" cy="7.4" r="0.55"/><circle cx="6.9" cy="7.4" r="0.55"/><circle cx="9.1" cy="7.4" r="0.55"/>
    </g>
    <circle cx="14" cy="16.5" r="2.4" fill="#5a5a62"/>
    <circle cx="14" cy="16.5" r="1.5" fill="#45454d"/>
    <circle cx="22" cy="16.5" r="2.4" fill="#5a5a62"/>
    <circle cx="22" cy="16.5" r="1.5" fill="#45454d"/>
    <rect x="6"  y="23.8" width="6" height="1.4" rx="0.7" fill="#62626a"/>
    <rect x="20" y="23.8" width="6" height="1.4" rx="0.7" fill="#62626a"/>
  </g>

  <!-- ================= ATOM Matrix (24x24x14) ================= -->
  <!-- 天面 (5x5 LED, 緑=publish中) -->
  <g transform="matrix(3.4641 2 -3.4641 2 170 26)">
    <rect x="0" y="0" width="24" height="24" rx="1.5" fill="#34343c" stroke="#17171a" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <g fill="#3ecf6e" stroke="#27a552" stroke-width="0.25">
      <use href="#ledrow"/>
      <use href="#ledrow" y="3.84"/>
      <use href="#ledrow" y="7.68"/>
      <use href="#ledrow" y="11.52"/>
      <use href="#ledrow" y="15.36"/>
    </g>
  </g>
  <!-- 前面 -->
  <g transform="matrix(3.4641 -2 0 4 170 122)">
    <rect x="0" y="0" width="24" height="14" fill="#2b2b31" stroke="#17171a" stroke-width="1" vector-effect="non-scaling-stroke"/>
  </g>
  <!-- 左側面 -->
  <g transform="matrix(3.4641 2 0 4 86.86 74)">
    <rect x="0" y="0" width="24" height="14" fill="#202025" stroke="#17171a" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <circle cx="3" cy="7" r="0.8" fill="#3a3a42"/>
  </g>

  <!-- ================= 測距ビーム ================= -->
  <line x1="228" y1="230" x2="318" y2="282" stroke="#d9756a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="342" y="286" font-size="11" fill="#c05f55">測距方向(前方・最大 2 m)</text>

  <!-- ================= ラベル ================= -->
  <g stroke="#b0b0b6" stroke-width="1">
    <line x1="388" y1="66"  x2="258" y2="72"/>
    <line x1="388" y1="146" x2="264" y2="172"/>
    <line x1="388" y1="226" x2="234" y2="231"/>
    <line x1="388" y1="336" x2="256" y2="300"/>
  </g>
  <g fill="#3a3a3f" font-size="13">
    <text x="394" y="70">ATOM Matrix</text>
    <text x="394" y="87"  font-size="11" fill="#84848c">5×5 LED で状態表示(緑=publish 中)</text>
    <text x="394" y="150">ATOM Mate for toio</text>
    <text x="394" y="167" font-size="11" fill="#84848c">拡張ベース(バッテリ内蔵・レゴ互換穴)</text>
    <text x="394" y="230">VL53L0X ToF 距離センサ窓</text>
    <text x="394" y="340">toio コアキューブ</text>
    <text x="394" y="357" font-size="11" fill="#84848c">上に載せて使用(本ファームウェアからは制御しない)</text>
  </g>
</svg>
